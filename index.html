<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оживи героя</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f1ff;
    color: #2b2350;
  }
  h1 { font-size: 28px; margin: 0 0 6px; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 16px; }

  /* ---------- Екран вибору ---------- */
  #choose { text-align: center; }
  #choose p { font-size: 20px; margin: 0 0 18px; }
  .choices { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
  .choice {
    display: block; text-align: center; font: inherit; color: inherit; cursor: pointer;
    background: #fff; border: 4px solid #cfc6ff; border-radius: 20px;
    padding: 14px; width: 220px;
  }
  .choice:hover, .choice:focus-visible { border-color: #7a5cff; outline: none; }
  .choice .pv { width: 165px; height: 220px; margin: 0 auto 10px; overflow: hidden; border-radius: 12px; }
  .choice iframe {
    width: 330px; height: 440px; border: 0; pointer-events: none;
    zoom: 0.5;
  }
  .choice b { display: block; font-size: 26px; }
  .choice span { font-size: 16px; color: #5b5384; }

  /* ---------- Конфігуратор ---------- */
  #app { display: none; }
  main { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 16px; align-items: start; }
  #heroFrame { width: 330px; height: 440px; border: 4px solid #cfc6ff; border-radius: 16px; background: #fff; display: block; box-sizing: content-box; margin: -4px; }
  .left { padding: 4px; }
  .btns { display: flex; gap: 10px; margin-top: 14px; }
  .btns button {
    font: inherit; font-size: 20px; font-weight: 700; cursor: pointer;
    padding: 12px 18px; border-radius: 12px; border: 3px solid #2e9e5b;
  }
  #run { background: #2e9e5b; color: #fff; flex: 1; }
  #reset { background: #fff; color: #2e9e5b; }
  #msg { margin-top: 12px; font-size: 18px; font-weight: 700; color: #b3261e; min-height: 1.4em; }
  .right label { display: block; font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  .right label small { font-weight: 400; color: #5b5384; font-size: 15px; }
  textarea {
    width: 100%; display: block; margin-bottom: 14px;
    font: 18px/1.4 ui-monospace, Menlo, Consolas, monospace;
    padding: 10px; border: 3px solid #cfc6ff; border-radius: 12px; background: #fff; color: #1f1a3d;
    resize: vertical; tab-size: 2;
  }
  textarea:focus { outline: none; border-color: #7a5cff; }
  #tHtml { height: 11em; }
  #tCss  { height: 11em; }
  #tJs   { height: 6em; }

  /* ---------- Міні-квіз (запасний) ---------- */
  #quiz { margin-top: 24px; background: #fff; border: 3px solid #cfc6ff; border-radius: 16px; padding: 12px 16px; }
  #quiz summary { font-size: 20px; font-weight: 700; cursor: pointer; }
  #qBody { padding-top: 12px; }
  #qCount { font-size: 16px; color: #5b5384; margin: 0 0 6px; }
  #qText { font-size: 24px; font-weight: 700; margin: 0 0 12px; }
  #qAnswers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #qAnswers button, #qAgain {
    font: inherit; font-size: 20px; font-weight: 700; cursor: pointer; text-align: left;
    padding: 12px 14px; border-radius: 12px; border: 3px solid #7a5cff; background: #f4f1ff; color: #2b2350;
  }
  #qAnswers button:hover:not(:disabled) { background: #e6dfff; }
  #qAnswers button.ok { background: #2e9e5b; border-color: #2e9e5b; color: #fff; }
  #qAnswers button.bad { background: #fff; border-color: #b3261e; color: #b3261e; }
  #qFeed { font-size: 20px; font-weight: 700; min-height: 1.5em; margin: 12px 0 0; }
  @media (max-width: 640px) { #qAnswers { grid-template-columns: 1fr; } }

  @media (max-width: 640px) {
    main { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- Екран вибору героя -->
  <section id="choose">
    <h1>Обери свого героя</h1>
    <p>Увага: вибрати можна лише один раз!</p>
    <div class="choices">
      <div class="choice" data-hero="kubyk" role="button" tabindex="0">
        <div class="pv"><iframe sandbox title="Кубик" tabindex="-1" id="pvKubyk"></iframe></div>
        <b>Кубик</b><span>Квадратний сміливець</span>
      </div>
      <div class="choice" data-hero="chibik" role="button" tabindex="0">
        <div class="pv"><iframe sandbox title="Чібік" tabindex="-1" id="pvChibik"></iframe></div>
        <b>Чібік</b><span>Великі очі, маленький герой</span>
      </div>
    </div>
  </section>

  <!-- Конфігуратор -->
  <section id="app">
    <main>
      <div class="left">
        <iframe id="heroFrame" title="Твій герой" sandbox="allow-scripts"></iframe>
        <div class="btns">
          <button id="run" type="button">▶ Запустити</button>
          <button id="reset" type="button">Скинути</button>
        </div>
        <div id="msg" role="alert"></div>
      </div>
      <div class="right">
        <label for="tHtml">Скелет <small>(HTML)</small></label>
        <textarea id="tHtml" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
        <label for="tCss">Одяг <small>(CSS)</small></label>
        <textarea id="tCss" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
        <label for="tJs">Мозок <small>(JS)</small></label>
        <textarea id="tJs" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
      </div>
    </main>

    <!-- Міні-квіз (запасний варіант, якщо немає Kahoot) -->
    <details id="quiz">
      <summary>Міні-квіз</summary>
      <div id="qBody">
        <p id="qCount"></p>
        <p id="qText"></p>
        <div id="qAnswers"></div>
        <p id="qFeed" role="status"></p>
        <button id="qAgain" type="button" hidden>Ще раз</button>
      </div>
    </details>
  </section>

</div>

    msg.textContent = '';
    frame.srcdoc = build(tHtml.value, tCss.value, null, current);
  }
  function reset() {
    tHtml.value = HERO_HTML;
    tCss.value = HEROES[current].css;
    tJs.value = JS_START;
    run();
  }

  var timer = null;
  function live() { clearTimeout(timer); timer = setTimeout(preview, 300); }
  tHtml.addEventListener('input', live);
  tCss.addEventListener('input', live);
  $('run').addEventListener('click', run);
  $('reset').addEventListener('click', reset);


  // ---------- Міні-квіз (запасний): усе в памʼяті сторінки ----------
  var QUIZ = [
    ['Хто в нашій історії офіціант?', ['Браузер', 'Сервер', 'Герой', 'Кнопка']],
    ['Яка частина сайту - скелет?', ['HTML', 'CSS', 'JS', 'Картинка']],
    ['Що відповідає за колір і вигляд?', ['CSS', 'HTML', 'JS', 'Мишка']],
    ['Що змушує героя підморгнути?', ['JS', 'HTML', 'CSS', 'Скелет']],
    ['Що буде після F5 на сторінці «Зламай сайт»?', ['Усе як було', 'Зміни залишаться', 'Сайт зламається назавжди', 'Інтернет вимкнеться']],
    ['Що ми зробили, щоб герой полисів?', ['Видалили рядок у HTML', 'Змінили колір у CSS', 'Додали рядок у JS', 'Натиснули F5']],
    ['Яка кнопка повертає героя таким, як був?', ['Скинути', 'Запустити', 'Delete', 'Enter']],
    ['У двох героїв однаковий скелет. Що в них різне?', ['Одяг (CSS)', 'Скелет (HTML)', 'Рецепт', 'Інтернет']]
  ];
  var qi = 0, qScore = 0, qLocked = false;
  var qCount = $('qCount'), qText = $('qText'), qAnswers = $('qAnswers'), qFeed = $('qFeed'), qAgain = $('qAgain');
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function showQ() {
    qLocked = false; qFeed.textContent = ''; qAgain.hidden = true; qAnswers.innerHTML = '';
    if (qi >= QUIZ.length) {
      qCount.textContent = '';
      qText.textContent = 'Готово! Правильних відповідей: ' + qScore + ' з ' + QUIZ.length;
      qAgain.hidden = false; return;
    }
    var q = QUIZ[qi], right = q[1][0];
    qCount.textContent = 'Питання ' + (qi + 1) + ' з ' + QUIZ.length;
    qText.textContent = q[0];
    shuffle(q[1]).forEach(function (ans) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = ans;
      b.addEventListener('click', function () {
        if (qLocked) return;
        if (ans === right) {
          qLocked = true; qScore++; b.className = 'ok'; qFeed.textContent = 'Правильно!';
          setTimeout(function () { qi++; showQ(); }, 1000);
        } else {
          b.className = 'bad'; b.disabled = true; qFeed.textContent = 'Майже! Спробуй ще раз.';
        }
      });
      qAnswers.appendChild(b);
    });
  }
  qAgain.addEventListener('click', function () { qi = 0; qScore = 0; showQ(); });
  showQ();

  // Вибір героя (один раз)
  var cards = document.querySelectorAll('.choice');
  Array.prototype.forEach.call(cards, function (c) {
    function pick() {
      if (current || !ready) return;
      current = c.getAttribute('data-hero');
      $('choose').style.display = 'none';
      $('app').style.display = 'block';
      reset();
    }
    c.addEventListener('click', pick);
    c.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); }
    });
  });
})();
</script>
</body>
</html>
