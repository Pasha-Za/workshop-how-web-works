<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #fff4d6;
    color: #2b2b2b;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 24px 24px;
    background: #ffffff;
    border: 4px solid #2b2b2b;
    border-radius: 24px;
    text-align: center;
  }
  h1 { margin: 0 0 12px; font-size: 40px; line-height: 1.15; }
  p { margin: 0 0 16px; font-size: 22px; line-height: 1.4; }
  .picture { margin: 8px auto 20px; width: 240px; max-width: 100%; }
  .picture img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
  button {
    font: inherit;
    font-size: 24px;
    font-weight: 700;
    padding: 14px 28px;
    border: 4px solid #2b2b2b;
    border-radius: 16px;
    background: #ffd23f;
    color: #2b2b2b;
    cursor: pointer;
  }
  button:hover { background: #ffc300; }
  #answer { min-height: 1.6em; margin: 16px 0 0; font-size: 22px; font-weight: 700; }
  .note {
    max-width: 560px;
    margin: 20px auto 0;
    font-size: 17px;
    line-height: 1.4;
    text-align: center;
    color: #5a5a5a;
  }
  .next { text-align: center; margin: 28px 0 40px; }
  .next a {
    display: inline-block; padding: 14px 28px; border-radius: 14px; border: 3px solid #2b2b2b;
    background: #7cffb2; color: #2b2b2b; font-size: 22px; font-weight: 700; text-decoration: none;
  }
  .next a:hover { background: #5be89a; }
</style>
